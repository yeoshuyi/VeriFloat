[project]
name = "VeriFloat"
version = "0.1.0"
description = "Bit-accurate floating-point, integer and block-scaled types with a C++ core, as golden models for cocotb RTL testbenches"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shu Yi", email = "yeoshuyi123@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["verification", "rtl", "cocotb", "golden-model", "bit-exact", "floating-point", "minifloat", "fp4", "fp8", "nvfp4", "fpga", "asic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/verifloat"]
cmake.build-type = "Release"

[dependency-groups]
dev = [
    "pytest>=8",
    # External golden references used by tests/test_external.py
    "numpy>=1.26",
    "ml-dtypes>=0.5",
    "gfloat>=0.5",
    "apytypes>=0.5",
    # Frozen pure-Python 0.1 (archive/python), the oracle for tests/test_parity.py
    "verifloat-py",
    "gmpy2>=2.2",
]
# Worked cocotb example (examples/fp32_adder); needs Verilator on PATH
examples = [
    "cocotb>=2.0",
]

[tool.uv.sources]
verifloat-py = { path = "archive/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must capture every FP warning they expect; any other one fails.
filterwarnings = ["error::verifloat.VeriFloatWarning"]
