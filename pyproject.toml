[project]
name = "VeriFloat"
dynamic = ["version"]     # from src/verifloat/__init__.py (see [tool.scikit-build.metadata])
description = "Bit-accurate floating-point, integer and block-scaled types with a C++ core, as golden models for cocotb RTL testbenches"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yeo Shu Yi"}]
requires-python = ">=3.12"
dependencies = []
keywords = ["verification", "rtl", "cocotb", "golden-model", "bit-exact", "floating-point", "minifloat", "fp4", "fp8", "nvfp4", "fpga", "asic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yeoshuyi/VeriFloat"
Documentation = "https://github.com/yeoshuyi/VeriFloat/blob/main/docs/README.md"
Repository = "https://github.com/yeoshuyi/VeriFloat"
Issues = "https://github.com/yeoshuyi/VeriFloat/issues"
Changelog = "https://github.com/yeoshuyi/VeriFloat/blob/main/CHANGELOG.md"

[build-system]
requires = ["scikit-build-core>=0.10,<2", "nanobind>=2.4,<3"]   # a new major version is taken on purpose, not by surprise
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/verifloat"]
cmake.build-type = "Release"
# The source package: what building needs, the tests and the docs, without
# the development scaffolding.
sdist.exclude = [".github", "bench", "tools/in_container", "tools/container_entry.sh", "examples/*/sim_build",
                 "examples/*/results.xml"]

# One version, in the package; the metadata, verifloat.__version__ and the C
# library's vf_version() all take it from there.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/verifloat/__init__.py"

# Wheels (.github/workflows/release.yml). Every wheel is installed on its own
# platform and must reproduce the golden corpus, written beforehand into
# ./corpus by tools/golden_corpus, and pass the test suite.
[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686 *-win_arm64"        # 64-bit targets only
build-frontend = "build"
test-requires = ["pytest", "numpy"]
test-command = [
    "python {project}/tools/golden_corpus verify {project}/corpus",
    "pytest {project}/tests -q -p no:cacheprovider -k \"not test_edge\"",
]
environment = { VERIFLOAT_ITERS = "300" }

[tool.cibuildwheel.macos]
environment = { VERIFLOAT_ITERS = "300", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[dependency-groups]
dev = [
    "pytest>=8",
    # External golden references used by tests/test_external.py
    "numpy>=1.26",
    "ml-dtypes>=0.5",
    "gfloat>=0.5",
    "apytypes>=0.5",
    # Frozen pure-Python 0.1 (archive/python), the oracle for tests/test_parity.py
    "verifloat-py",
    "gmpy2>=2.2",
]
# Worked cocotb example (examples/fp32_adder); needs Verilator on PATH
examples = [
    "cocotb>=2.0",
]

[tool.uv.sources]
verifloat-py = { path = "archive/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must capture every FP warning they expect; any other one fails.
filterwarnings = ["error::verifloat.VeriFloatWarning"]
