# The test suite on the operating systems and CPUs that cannot be reached
# from one Linux machine: macOS (Apple silicon and Intel), Windows (MSVC with
# the python.org Python, and MinGW-w64 in MSYS2) and native ARM Linux. MSVC
# has no __int128, so it builds the portable 128-bit integers of
# src/cpp/int128.hpp; the `portable` job runs them on Linux as well. Linux distributions, C libraries, compilers and emulated
# architectures are covered locally by tools/in_container.
#
# The first job writes the golden corpus on x86-64 Linux; every other job
# must reproduce it bit for bit (tools/golden_corpus) and pass the suite.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# The jobs only read the repository. Third-party actions are pinned to a
# commit (the release it was is in the comment), so a moved tag cannot change
# what runs here.
permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python tools/golden_corpus generate corpus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: corpus
          path: corpus

  unix:
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: corpus
          path: corpus
      - run: pip install . ./archive/python pytest numpy
      # The external references: where a wheel is missing, their tests are skipped.
      - run: |
          for p in gmpy2 ml-dtypes gfloat apytypes; do pip install --only-binary :all: $p || true; done
      - run: python tools/golden_corpus verify corpus
      - name: test suite (the installed build, not the source directory)
        run: |
          rm -rf src/verifloat
          pytest -q -p no:cacheprovider tests -k "not test_edge"

  # GCC with the portable 128-bit integers that MSVC uses, on the whole suite.
  portable:
    needs: corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: corpus
          path: corpus
      - run: pip install -C cmake.define.VF_PORTABLE_INT128=ON . ./archive/python pytest numpy gmpy2 ml-dtypes gfloat apytypes
      - run: python tools/golden_corpus verify corpus
      - name: test suite (the installed build, not the source directory)
        run: |
          rm -rf src/verifloat
          pytest -q -p no:cacheprovider tests -k "not test_edge"

  msvc:
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: corpus
          path: corpus
      - run: pip install . ./archive/python pytest numpy
      - name: external references (where a wheel is missing, their tests are skipped)
        shell: bash
        run: |
          for p in gmpy2 ml-dtypes gfloat apytypes; do pip install --only-binary :all: $p || true; done
      - run: python tools/golden_corpus verify corpus
      - name: test suite (the installed build, not the source directory)
        shell: bash
        run: |
          rm -rf src/verifloat
          pytest -q -p no:cacheprovider tests -k "not test_edge"

  mingw:
    needs: corpus
    runs-on: windows-latest
    env:
      # MSYS2's Python may be marked externally managed; this job owns it.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          # make (with the toolchain's gcc and ar) builds Berkeley SoftFloat and
          # TestFloat, the references of the SoftFloat and TestFloat tests.
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pytest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: corpus
          path: corpus
      - run: pip install . ./archive/python
      - run: python tools/golden_corpus verify corpus
      - name: test suite (the installed build, not the source directory)
        run: |
          rm -rf src/verifloat
          pytest -q -p no:cacheprovider tests -k "not test_edge"
